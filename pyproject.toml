[project]
name = "sehtsnap"
version = "0.3.1"
description = "AI nutrition app (Python + Flet) that recognizes South Asian food from photos and calculates calories"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Khizar Hayat" }]
dependencies = [
    "flet==1.1.2",
    "flet-camera==1.1.2",
    "flet-charts==1.1.2",
    "httpx==0.28.1",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
direct-ai = ["google-genai==3.6.1", "openai==3.57.0"]
dev = [
    "CacheControl==0.15.0",
    "fastapi==0.165.0",
    "google-auth==2.63.1",
    "pytest==9.2.0",
    "requests==2.34.2",
    "ruff==0.17.6",
    "uvicorn==0.54.0",
]

[tool.flet]
org = "com.khizarsys"
project = "sehtsnap"
product = "SehtSnap"

[tool.flet.app]
path = "."
exclude = ["backend", "web", "Dockerfile", "Dockerfile.web", "data", "tests", "scripts", "screenshots", "build", "dist", "storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/seed_demo_data.py" = ["E501"]
