[project]
name = "sehtsnap"
version = "0.1.0"
description = "AI nutrition app (Python + Flet) that recognizes South Asian food from photos and calculates calories"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Khizar Hayat" }]
dependencies = [
    "flet==1.1.2",
    "flet-charts==1.1.2",
    "google-genai==3.6.1",
    "httpx==0.28.1",
    "openai==3.57.0",
    "pillow==13.0.0",
    "pydantic==2.14.4",
    "python-dotenv==1.2.4",
    "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
